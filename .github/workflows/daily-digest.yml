name: SDG Daily Digest

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the digest email through Resend"
        type: boolean
        default: false
      lookback_days:
        description: "How many days of source updates to scan"
        type: number
        default: 3
  schedule:
    - cron: "30 14 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Pacific schedule window
        id: run_window
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          event_name = os.environ["EVENT_NAME"]
          event_schedule = os.environ.get("EVENT_SCHEDULE", "")
          if event_name != "schedule":
              should_run = "true"
          else:
              now = datetime.now(ZoneInfo("America/Los_Angeles"))
              expected = "30 14 * * *" if now.utcoffset().total_seconds() == -7 * 3600 else "30 15 * * *"
              should_run = "true" if event_schedule == expected else "false"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"should_run={should_run}\n")
          PY

      - name: Generate digest
        if: steps.run_window.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
        run: |
          LOOKBACK_DAYS="${{ github.event.inputs.lookback_days || '3' }}"
          SEND_EMAIL="${{ github.event_name == 'schedule' || github.event.inputs.send_email == 'true' }}"
          if [ "$SEND_EMAIL" = "true" ]; then
            python -m sdg_digest.cli --lookback-days "$LOOKBACK_DAYS" --send-email
          else
            python -m sdg_digest.cli --lookback-days "$LOOKBACK_DAYS" --dry-run
          fi

      - name: Commit archive
        if: steps.run_window.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --quiet || git commit -m "Archive SDG digest for $(date -u +%F)"
          git push
